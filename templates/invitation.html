<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Invitation created · Budget Bloom</title><script src="/static/theme.js?v={{ static_version }}"></script><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/layout-fixes.css"></head>
<body class="auth-page"><button class="theme-toggle auth-theme-toggle" type="button" aria-label="Switch color theme">☾</button><main class="auth-card">
  <p class="eyebrow">INVITATION CREATED</p><h1>Budget <em>Bloom</em></h1><h2>Share this link once</h2>
  <p class="invite-note">This invitation expires {{ expires }} and can create one account.</p>
  <label>Registration page<input value="{{ invite_url }}" readonly data-select></label>
  <label>Code<input value="{{ token }}" readonly data-select></label>
  <p class="auth-switch"><a href="{{ '/' if signed_in else '/login' }}">Done</a></p>
</main><script src="/static/app.js?v={{ static_version }}"></script></body></html>
